<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic iMessage Group Chat</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chat.css">
    <!-- Free Live Real-time Web Connection Stream Provider -->
</head>
<body>

    <!-- Ambient Cosmic Particle Canvas Background Layer -->
    <canvas id="galaxyCanvas"></canvas>

    <!-- Header bar containing the uploader button -->
    <header class="top-nav">
        <div id="statusMessage" class="status-badge">Theme Synced</div>
        <label for="imageUpload" class="action-btn upload-corner-btn">Choose Background</label>
        <input type="file" id="imageUpload" accept="image/*">
    </header>

    <!-- Centralized Chat Box Container -->
    <main class="app-container">
        <div class="panel chat-panel glass-panel">
            
            <!-- Step 1: Just Ask For Name Portal -->
            <div id="authPortal" class="chat-auth">
                <h2>Welcome to iMessage</h2>
                <p class="subtitle">Enter your name to join the global group chat loop.</p>
                <div class="input-group">
                    <input type="text" id="userNameInput" placeholder="Your Name (e.g., Bob)" autocomplete="off">
                </div>
                <button id="joinChatBtn" class="action-btn format-btn">Join Chat</button>
            </div>

            <!-- Step 2: Main iMessage Styled Room Window -->
            <div id="chatRoom" class="chat-room hidden">
                <div class="chat-header">
                    <div class="room-title">🚀 Global Cosmic Room</div>
                    <div class="room-status">Connected as <span id="activeUserName">Guest</span></div>
                </div>
                
                <!-- Chat Feed Message Stream View -->
                <div id="chatMessageFeed" class="chat-feed">
                    <div class="system-msg">Connected to the shared network. Everyone using this page chats here in real time. Changing the background changes it for everyone!</div>
                </div>

                <!-- Input Footer Messaging Bar -->
                <div class="chat-footer">
                    <input type="text" id="chatMessageInput" placeholder="iMessage" autocomplete="off">
                    <button id="sendTransmissionBtn" class="send-btn">➔</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Core Script files link pipeline -->
    <script src="script.js"></script>
    <script src="chat.js"></script>
</body>
</html>
