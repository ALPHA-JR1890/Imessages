name: Deploy Cosmic Chat to GitHub Pages

on:
  push:
    branches:
      - main  # Triggers deployment whenever you push updates to your main branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Web Hosting Environment
        uses: actions/configure-pages@v4

      - name: Upload Static Website Assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Deploys files from your root folder directory

      - name: Publish Live to GitHub Pages Web Network
        id: deployment
        uses: actions/deploy-pages@v4
